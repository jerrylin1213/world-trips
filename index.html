<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="環遊世界" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="icon.png" />
    <title>全家環遊世界</title>
    <style>
      :root {
        --bg: #f6f4ef; --surface: #ffffff; --surface-2: #f7f5f0;
        --fg: #18191d; --fg-2: #3d3f46; --muted: #6c6d74; --faint: #9b9ba1;
        --line: rgba(24, 25, 29, 0.08); --line-2: rgba(24, 25, 29, 0.16);
        --seg-bg: rgba(24, 25, 29, 0.06); --dot: rgba(24, 25, 29, 0.17);
        --accent: #2a5bd7; --accent-2: #7b5cd6; --accent-bg: #ecf1fd; --accent-ink: #1f47a8; --link: #2556c4;
        --summer: #e2722b; --summer-2: #f0a93b; --summer-bg: #fdf0e4; --summer-ink: #a24b12;
        --winter: #2b78cf; --winter-2: #22a6be; --winter-bg: #e8f1fb; --winter-ink: #1d5291;
        --short: #d6517f; --short-2: #9a68d8; --short-bg: #fbeaf1; --short-ink: #a02c58;
        --ok-bg: #e5f4ea; --ok-ink: #1f6d3b; --warn-bg: #fdefdc; --warn-ink: #8f4e0b;
        --shadow-sm: 0 1px 2px rgba(24, 25, 29, 0.06);
        --shadow: 0 1px 2px rgba(24, 25, 29, 0.04), 0 10px 26px -12px rgba(24, 25, 29, 0.16);
        --shadow-lg: 0 2px 6px rgba(24, 25, 29, 0.06), 0 24px 46px -16px rgba(24, 25, 29, 0.24);
        --ab-h: 56px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0f14; --surface: #151a21; --surface-2: #1a2028;
          --fg: #eef0f3; --fg-2: #c7ccd4; --muted: #9aa2ad; --faint: #6b7480;
          --line: rgba(255, 255, 255, 0.07); --line-2: rgba(255, 255, 255, 0.14);
          --seg-bg: rgba(255, 255, 255, 0.07); --dot: rgba(255, 255, 255, 0.15);
          --accent: #7aa5ff; --accent-2: #a98bff; --accent-bg: rgba(122, 165, 255, 0.12); --accent-ink: #a9c4ff; --link: #86aefc;
          --summer: #f2924a; --summer-2: #f6bf55; --summer-bg: rgba(242, 146, 74, 0.14); --summer-ink: #f6b07a;
          --winter: #5b9ff0; --winter-2: #44c7da; --winter-bg: rgba(91, 159, 240, 0.14); --winter-ink: #93c0f6;
          --short: #ee77a3; --short-2: #b28df2; --short-bg: rgba(238, 119, 163, 0.14); --short-ink: #f4a2c1;
          --ok-bg: rgba(72, 187, 120, 0.16); --ok-ink: #8fdcab; --warn-bg: rgba(242, 168, 78, 0.16); --warn-ink: #f4c385;
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
          --shadow-lg: 0 2px 8px rgba(0, 0, 0, 0.4), 0 26px 50px -18px rgba(0, 0, 0, 0.7);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 17px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-tap-highlight-color: transparent;
      }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      .num { font-variant-numeric: tabular-nums; }
      .ic { width: 20px; height: 20px; flex: none; }
      .page { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
      .t-summer { --trk: var(--summer); --trk2: var(--summer-2); --trk-bg: var(--summer-bg); --trk-ink: var(--summer-ink); }
      .t-winter { --trk: var(--winter); --trk2: var(--winter-2); --trk-bg: var(--winter-bg); --trk-ink: var(--winter-ink); }
      .t-short { --trk: var(--short); --trk2: var(--short-2); --trk-bg: var(--short-bg); --trk-ink: var(--short-ink); }
      .t-neutral { --trk: var(--accent); --trk2: var(--accent-2); --trk-bg: var(--accent-bg); --trk-ink: var(--accent-ink); }

      /* splash */
      .splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
      .splash .map { width: min(560px, 86vw); }
      .splash-t { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
      .splash-s { font-size: 15px; color: var(--muted); max-width: 30em; }
      .splash.busy .splash-t { animation: breathe 1.6s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: 0.45; } }

      /* app bar */
      .appbar {
        position: sticky; top: 0; z-index: 40; padding-top: env(safe-area-inset-top);
        background: transparent; border-bottom: 1px solid transparent; transition: background 0.2s, border-color 0.2s;
      }
      .appbar.scrolled {
        background: color-mix(in srgb, var(--bg) 80%, transparent);
        -webkit-backdrop-filter: saturate(1.8) blur(18px); backdrop-filter: saturate(1.8) blur(18px);
        border-bottom-color: var(--line);
      }
      .ab-in { max-width: 1120px; margin: 0 auto; height: var(--ab-h); display: flex; align-items: center; gap: 10px; padding: 0 14px 0 16px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: 0.02em; white-space: nowrap; }
      .brand-mark {
        width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff;
        background: linear-gradient(135deg, var(--summer), var(--short) 55%, var(--winter));
        box-shadow: 0 4px 10px -4px color-mix(in srgb, var(--short) 60%, transparent);
      }
      .brand-mark .ic { width: 18px; height: 18px; }
      .topnav { display: none; gap: 4px; margin: 0 auto; }
      .topnav a { padding: 7px 16px; border-radius: 999px; font-size: 15px; color: var(--muted); font-weight: 650; }
      .topnav a.on { color: var(--fg); background: var(--surface); box-shadow: var(--shadow-sm); }
      .grow { flex: 1; }
      .iconbtn {
        width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; flex: none;
        background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm);
      }
      .ab-title {
        flex: 1; min-width: 0; text-align: center; font-weight: 750; font-size: 17px; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; opacity: 0; transform: translateY(4px); transition: opacity 0.2s, transform 0.2s;
      }
      .appbar.show-title .ab-title { opacity: 1; transform: none; }

      /* segmented control */
      .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--seg-bg); gap: 2px; flex: none; }
      .seg button { padding: 5px 13px; border-radius: 999px; font-size: 14px; font-weight: 650; color: var(--muted); white-space: nowrap; transition: background 0.15s, color 0.15s; }
      .seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }

      /* tab bar */
      .tabbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: space-around;
        padding: 6px 8px calc(4px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--bg) 84%, transparent);
        -webkit-backdrop-filter: saturate(1.8) blur(18px); backdrop-filter: saturate(1.8) blur(18px);
        border-top: 1px solid var(--line);
      }
      .tabbar a { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 0; font-size: 14px; font-weight: 650; color: var(--faint); }
      .tabbar a .ic { width: 24px; height: 24px; }
      .tabbar a.on { color: var(--fg); }
      .has-tabbar { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }

      /* home hero */
      .hero { padding-top: 18px; padding-bottom: 4px; }
      .eyebrow { font-size: 13px; letter-spacing: 0.18em; font-weight: 750; color: var(--muted); }
      .display { font-size: 38px; line-height: 1.15; margin: 8px 0 12px; font-weight: 800; letter-spacing: 0.01em; }
      .grad { background: linear-gradient(100deg, var(--summer), var(--short) 50%, var(--winter)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .lede { font-size: 17px; color: var(--fg-2); margin: 0 0 18px; max-width: 34em; }
      .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
      .stat b { display: block; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; }
      .stat span { font-size: 14px; color: var(--muted); }
      .note { font-size: 14px; color: var(--muted); margin: 10px 2px 0; }

      /* map */
      .mapcard { margin: 16px 0 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px 12px 8px; box-shadow: var(--shadow); }
      .map { display: block; width: 100%; height: auto; }
      .map .land { fill: none; stroke: var(--dot); stroke-width: 0.8; stroke-linecap: round; }
      .mk { cursor: pointer; }
      .mk .halo { fill: var(--trk); opacity: 0.25; transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-out infinite; }
      .mk .dot { fill: var(--trk); stroke: var(--surface); stroke-width: 0.55; }
      .mk .hit { fill: transparent; }
      .mk.off { opacity: 0.14; pointer-events: none; }
      .mk.off .halo { animation: none; }
      .pin circle { fill: none; stroke: var(--fg); stroke-width: 0.6; }
      .pin .in { fill: var(--fg); stroke: none; }
      @keyframes pulse { 0% { transform: scale(0.55); opacity: 0.4; } 75% { transform: scale(1.5); opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .mk .halo { animation: none; } }
      .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; padding: 8px 4px 4px; font-size: 14px; color: var(--muted); }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--trk); }
      .legend i.homei { background: none; border: 1.5px solid var(--fg); }

      /* timeline */
      .listhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 30px 0 2px; }
      .listhead h2 { font-size: 23px; margin: 0; font-weight: 800; }
      .year { margin-top: 26px; }
      .yhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 2px 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
      .ynum { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
      .ymeta { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--muted); }
      .age { padding: 2px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--fg-2); font-size: 14px; font-weight: 650; }
      .cards { display: grid; gap: 14px; }
      .tcard {
        position: relative; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
        padding: 18px 18px 16px 22px; box-shadow: var(--shadow); overflow: hidden; transition: transform 0.15s, box-shadow 0.15s;
      }
      .tcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, var(--trk), var(--trk2)); }
      .tcard::after {
        content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--trk) 14%, transparent), transparent 70%); pointer-events: none;
      }
      .tcard:active { transform: scale(0.985); }
      @media (hover: hover) { .tcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); } }
      .tc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .tag { font-size: 14px; font-weight: 750; color: var(--trk-ink); background: var(--trk-bg); padding: 3px 11px; border-radius: 999px; letter-spacing: 0.02em; }
      .tc-days { font-size: 15px; color: var(--muted); font-weight: 650; }
      .tc-title { font-size: 22px; font-weight: 800; margin: 10px 0 3px; letter-spacing: 0.01em; line-height: 1.3; }
      .tc-sub { font-size: 15px; color: var(--fg-2); line-height: 1.55; }
      .tc-meta { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 15px; color: var(--muted); }
      .tc-meta .ic { width: 16px; height: 16px; }
      .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); margin: 0 4px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .chip { font-size: 14px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
      .chip b { font-weight: 750; color: var(--fg); }
      .chip.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
      .tc-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-2); }
      .tc-price b { display: block; font-size: 24px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
      .tc-price span { font-size: 14px; color: var(--muted); }
      .flags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .flag { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 650; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
      .flag .ic { width: 14px; height: 14px; }
      .flag.ok { background: var(--ok-bg); color: var(--ok-ink); }
      .flag.warn { background: var(--warn-bg); color: var(--warn-ink); }
      .empty { padding: 30px 0; text-align: center; color: var(--muted); font-size: 15px; }

      /* detail hero */
      .dhero {
        position: relative; overflow: hidden; padding: calc(var(--ab-h) + env(safe-area-inset-top) + 18px) 0 22px;
        margin-top: calc(-1 * (var(--ab-h) + env(safe-area-inset-top)));
      }
      .dh-bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--trk) 24%, transparent), transparent 60%),
          radial-gradient(110% 90% at 100% 100%, color-mix(in srgb, var(--trk2) 20%, transparent), transparent 55%),
          var(--bg);
      }
      .dh-mark {
        position: absolute; right: -8px; bottom: -40px; font-size: 160px; font-weight: 900; letter-spacing: -0.04em;
        color: var(--trk); opacity: 0.1; line-height: 1; pointer-events: none; user-select: none;
      }
      .dh-in { position: relative; }
      .dh-title { font-size: 34px; line-height: 1.2; font-weight: 800; margin: 12px 0 6px; letter-spacing: 0.01em; }
      .dh-sub { font-size: 16px; color: var(--fg-2); margin: 0 0 18px; line-height: 1.6; max-width: 40em; }
      .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .fact {
        display: flex; gap: 10px; align-items: center; border-radius: 16px; padding: 10px 12px;
        background: color-mix(in srgb, var(--surface) 86%, transparent); border: 1px solid var(--line);
      }
      .fact .ic { width: 20px; height: 20px; color: var(--trk); }
      .fact span { display: block; font-size: 14px; color: var(--muted); line-height: 1.3; }
      .fact b { display: block; font-size: 17px; font-weight: 750; line-height: 1.35; }
      .minis { display: grid; gap: 10px; }
      .mini { display: grid; gap: 1px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
      .mini-id { font-size: 14px; font-weight: 750; color: var(--trk-ink); }
      .mini-t { font-size: 18px; font-weight: 800; }
      .mini-m { font-size: 15px; color: var(--muted); }

      /* section bar */
      .secbar {
        position: sticky; top: calc(var(--ab-h) + env(safe-area-inset-top)); z-index: 30;
        background: color-mix(in srgb, var(--bg) 84%, transparent);
        -webkit-backdrop-filter: saturate(1.8) blur(18px); backdrop-filter: saturate(1.8) blur(18px);
        border-bottom: 1px solid var(--line);
      }
      .sb-in { max-width: 1120px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto; padding: 9px 16px; scrollbar-width: none; }
      .sb-in::-webkit-scrollbar { display: none; }
      .sb-in a {
        flex: none; font-size: 15px; font-weight: 650; padding: 6px 14px; border-radius: 999px; color: var(--muted);
        background: var(--surface); border: 1px solid var(--line); white-space: nowrap; transition: background 0.15s, color 0.15s;
      }
      .sb-in a.on { background: var(--trk); border-color: var(--trk); color: #fff; }

      /* document */
      .doc { max-width: 780px; margin: 0 auto; padding: 4px 20px 20px; overflow-wrap: anywhere; }
      .doc .preface h1 { display: none; }
      .doc .preface hr { display: none; }
      .doc h2 { font-size: 24px; line-height: 1.35; font-weight: 800; margin: 42px 0 14px; letter-spacing: 0.01em; }
      .doc h2::before { content: ""; display: block; width: 34px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--trk), var(--trk2)); margin-bottom: 12px; }
      .doc h3 { font-size: 19px; line-height: 1.45; font-weight: 750; margin: 30px 0 8px; }
      .doc h4 { font-size: 17px; font-weight: 750; margin: 22px 0 6px; }
      .doc h2, .doc h3, .doc h4 { scroll-margin-top: calc(env(safe-area-inset-top) + 128px); }
      .doc p, .doc li { font-size: 17px; line-height: 1.78; }
      .doc p { margin: 10px 0; }
      .doc ul, .doc ol { padding-left: 1.3em; margin: 10px 0; }
      .doc li { margin: 6px 0; }
      .doc li::marker { color: var(--trk); }
      .doc strong { font-weight: 750; }
      .doc a { color: var(--link); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 30%, transparent); text-underline-offset: 3px; }
      .doc blockquote {
        margin: 16px 0; padding: 14px 16px; border-radius: 18px; background: var(--trk-bg);
        border: 1px solid color-mix(in srgb, var(--trk) 18%, transparent);
      }
      .doc blockquote p { font-size: 16px; margin: 6px 0; line-height: 1.72; }
      .doc blockquote.summary { padding: 14px 16px 12px; }
      .doc blockquote.summary::before { content: "摘要"; display: block; font-size: 13px; letter-spacing: 0.16em; font-weight: 800; color: var(--trk-ink); margin-bottom: 4px; }
      .doc blockquote.summary p { font-size: 15px; margin: 6px 0; line-height: 1.65; }
      .doc blockquote.summary strong { color: var(--trk-ink); }
      .doc hr { border: 0; height: 1px; background: var(--line); margin: 28px 0; }
      .doc pre { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; overflow-x: auto; font-size: 14px; line-height: 1.55; box-shadow: var(--shadow-sm); }
      .doc code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.88em; background: var(--surface-2); padding: 1px 5px; border-radius: 6px; }
      .doc pre code { background: none; padding: 0; font-size: 14px; }
      .tbl { margin: 14px 0 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); }
      .doc table { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.55; font-variant-numeric: tabular-nums; }
      .doc th, .doc td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); min-width: 3em; overflow-wrap: normal; }
      .doc th { font-size: 14px; font-weight: 750; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
      .doc tbody tr:last-child td { border-bottom: 0; }
      .doc tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
      .doc .c-long { min-width: 9em; }
      .doc .c-mid { min-width: 5em; }
      .doc .c-short { white-space: nowrap; }
      .doc .sources p, .doc .sources li { font-size: 14px; line-height: 1.6; color: var(--muted); }
      .doc .sources a { word-break: break-all; }
      .deadlink { color: var(--muted); }

      /* prev / next, footer */
      .pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 780px; margin: 12px auto 0; padding: 0 20px; }
      .pn-a { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .pn-a span { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); }
      .pn-a span .ic { width: 16px; height: 16px; }

  <body>
    <div id="app"></div>
    <script>
      /* 全家環遊世界計劃 — 加密唯讀網站（見 publish.mjs）。
         這個頁面是公開的；bundle.bin 是 AES-256-GCM 密文。鑰匙只在網址片段 #k=…，
         瀏覽器不會送到伺服器；刻意不存進 localStorage／sessionStorage：同一個
         *.github.io 帳號底下的所有網站共用同一個 origin，存了會被其他網站讀到。 */
      (async () => {
        "use strict";
        const DOTS = {"source":"Natural Earth 1:110m land (public domain)","step":2,"lat0":76,"lon0":-180,"cols":180,"rows":["0000000038afc007ffff00000000030007ffc001d8000","0000000e88b7b003fffe000000000c003ffffec000000","80180009fc33fc00fffa00000300041dffffffeffc801","00fffbfe725d8f00fff800001ff000edfffffffffffdf","e0ffffffffff87c1ff8000007ffebffdfffffffffffff","31fffffffffd1f80fc01e000f9ebfffffffffffffffff","00fffffffff8034078000003e7fffffffffffffffffff","01fdffffffe01e0038000007e7ffffffffffffffff2f0","007807ffffe01e4000000007e3ffffffffffffff82200","001001fffff80fe000000182c7fffffffffffffe00f00","0080007fffff9ff8000003820ffffffffffffffc00e00","0000007fffff9ffc000006cfffffffffffffffffc0800","0000003ffffffffc000000dfffffffffffffffff40000","00000017ffffff460000007fffffffffffffffff40000","0000000fffffffc10000007ffffffffffffffffe40000","0000000fffffff600000007f7f97cffffffffffc00000","0000000ffffffe00000007f19f03cffffffffff8c0000","0000000ffffffc00000003c26f7fe7ffffffffe080000","0000000ffffff000000007c02dffe7fffffff84080000","00000007fffff0000000018740ffe7fffffffe6300000","00000003fffff000000001fe022ffffffffffc4f00000","00000001ffffc000000003ff000ffffffffffc1800000","00000000ffff8000000007ffef7ffffffffffe0000000","000000003fc04000000007ffffffdffffffffe0000000","000000005f80400000001fffffefe7fffffffc0000000","000000002f80000000001fffffe7f41ffffffc0000000","000000000780c00000003ffffff7ff07fffff20000000","000000000786100000007ffffffbfe07fcff000000000","0000000003cc020000003ffffff9fe03f07e800000000","0000000000fc000000003ffffff9f801e07f020000000","00000000000f000000007ffffffde001c01f020000000","000000000003000000003ffffffe8001c01f820000000","0000000000010f0000003fffffff3000c013008000000","000000000000aff000001fffffffe000a012000000000","0000000000001ff800000fffffffe0002000008000000","0000000000001fff00000687ffffc000002c180000000","0000000000001fff80000001ffff80000014380000000","0000000000003fff80000001ffff000000187a0000000","0000000000003fffe0000003fffe0000000c781800000","0000000000003ffffc000001fffc00000006762b80000","0000000000007fffff000000fffc000000020101e0000","0000000000003fffff800000fffc00000001c001f0800","0000000000001fffff000000fffc000000000880d0200","0000000000001ffffe0000007ffc00000000000000000","0000000000000ffffe000000fffc20000000001c40000","0000000000000ffffe000000fffc2000000000fc60040","00000000000003fffc000000fff8e000000001fe60000","00000000000001fffc000000fff0e000000001ffe0000","00000000000001fffc0000007ff0c00000000ffff8080","00000000000001fff00000007ff0c00000001ffff8000","00000000000001ffc00000007fe0800000001ffffc000","00000000000001ffc00000003fc0000000001ffffe000","00000000000003ff800000003fc0000000001ffffe000","00000000000003ff800000001f80000000000ffffe000","00000000000003ff000000001f00000000000f07fc000","00000000000003f8000000000000000000000801f8008","00000000000007fc000000000000000000000000f8004","00000000000007e000000000000000000000000000006","00000000000007a00000000000000000000000003000c","00000000000003c000000000000000000000000010018","000000000000078000000000000000000000000000030","000000000000078000000000000000000000000000000","0000000000000f0000000000000000080000000000000","0000000000000e0000000000000000000000000000000","000000000000070000000000000000000000000000000","000000000000030000000000000000000000000000000","000000000000000000000000000000000000000000000"]};
        const app = document.getElementById("app");
        const H = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        const ICONS = {
          back: '<path d="M15 18l-6-6 6-6"/>',
          list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
          globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z"/>',
          chart: '<path d="M4 20h16"/><path d="M7.5 16.5v-5M12 16.5V6.5M16.5 16.5v-8"/>',
          passport: '<rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="10.5" r="3.2"/><path d="M9 17h6"/>',
          cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',

          arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>',
          arrowL: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
          lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
          school: '<path d="M3 9.5l9-5 9 5-9 5-9-5z"/><path d="M7 12v4.3c0 1.3 2.2 2.4 5 2.4s5-1.1 5-2.4V12"/>',

          chev: '<path d="M9 6l6 6-6 6"/>',
        };
        const ic = (n, cls = "") =>
          `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ""}</svg>`;

        let LAND = "";
        DOTS.rows.forEach((hex, r) => {
          for (let i = 0; i < hex.length; i++) {
            const v = parseInt(hex[i], 16);

        const xy = ([lat, lon]) => [(lon - DOTS.lon0) / DOTS.step, (DOTS.lat0 - lat) / DOTS.step];
        function mapSVG(markers = "") {
          return `<svg class="map" viewBox="0 0 ${DOTS.cols} ${DOTS.rows.length}" role="img" aria-label="世界地圖"><path class="land" d="${LAND}"/>${markers}</svg>`;

        if (!window.crypto || !crypto.subtle || !window.DecompressionStream)

        } catch (e) {
          return e && e.name === "OperationError"
            ? splash("鑰匙已失效", "可能在 Mac 上換過鑰匙，請用新的連結。")
            : splash("載入失敗", String((e && e.message) || e));

        // ---------- data helpers ----------
        const T = B.trips;
        const SEASON = { summer: "暑假", winter: "寒假", spring: "春假", midwinter: "期中假" };

        const money = (x) => (x == null ? "—" : "$" + (x / 1000).toFixed(1) + "K");

        const md = (iso) => { const [, m, d] = String(iso).split("-"); return Number(m) + "/" + Number(d); };
        const when = new Date(B.generated).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
        const docShort = (d) => (d === "E" ? "東亞短程" : (T.find((t) => t.doc === d) || {}).short || (B.docs[d] || {}).label || d);
        let tier = "mid";
        let filter = "all";
        const match = (t) =>
          filter === "all" || (filter === "short" ? t.track === "spring" || t.track === "midwinter" : t.track === filter);
        const price = (t) => (tier === "mid" ? t.mid : t.comfort);

        const go = (p, a) => {
          const q = new URLSearchParams();
          q.set("k", K);

          if (a) q.set("a", a);

        // ---------- shared chrome ----------
        const NAV = [["trips", "行程", "globe"], ["safety", "安全", "shield"], ["home", "總覽", "chart"], ["G1", "證件", "passport"]];
        function topbar(cur) {
          return `<header class="appbar"><div class="ab-in">
            <a class="brand" href="#" data-go="trips"><span class="brand-mark">${ic("globe")}</span><span>環遊世界計劃</span></a>

          }
          if (el.dataset.safety) return go("safety", "c-" + el.dataset.safety);
          if (el.dataset.go) return go(el.dataset.go);
          if (el.dataset.trip) return go(...tripTarget(el.dataset.trip));
          if (el.dataset.doc) return go(el.dataset.doc, el.dataset.anchor || "");
          if (el.dataset.anchor) return jump(el.dataset.anchor);
        });
        addEventListener("keydown", (e) => { if (e.key === "Escape") sheet(false); });

        let lastPage = null, listY = 0;
        function route() {
          const q = params();
          if (q.get("k") !== K) return location.reload();
          const p = q.get("p") || "trips";
          const a = q.get("a") || "";
          if (p === lastPage && p !== "trips" && a) return jump(a);
          if (lastPage === "trips" && p !== "trips") listY = scrollY;
          cleanup();
          if (p === "trips") {
            homeView();
            window.scrollTo(0, lastPage && lastPage !== "trips" ? listY : 0);
          } else if (p === "safety" || p === "G2") {
            safetyView(a);
            if (!a) window.scrollTo(0, 0);
          } else docView(p, a);
          lastPage = p;
        }
        addEventListener("hashchange", route);
        route();
      })();
    </script>
  </body>
</html>
